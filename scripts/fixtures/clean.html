<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean fixture</title>
<style>
  body { font-family: sans-serif; background: #ffffff; color: #111111; margin: 0; }
  header, main, footer { padding: 16px; }
  a { color: #0b4fa8; }
  button { background: #0b4fa8; color: #ffffff; border: 0; padding: 8px 16px; font-size: 1rem; }
  label { display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<header><h1>Clean page</h1></header>
<main>
  <p>This page has no accessibility violations and makes no external requests.</p>
  <form>
    <label for="name">Name</label>
    <input id="name" name="name" type="text">
    <button type="submit">Send</button>
  </form>
  <p><a href="#top">Back to top</a></p>
</main>
<footer><p>Footer text</p></footer>
</body>
</html>
